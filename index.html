function shrink(file,max,q){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(Error("Rasm o‘qilmadi")),"image/jpeg",q)};img.onerror=()=>rej(Error("Rasm ochilmadi"));img.src=u})}
const asURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function upImgs(saleId,inp,tbl="sale_images"){const fs=[...(inp&&inp.files||[])].slice(0,MAXIMG);if(!fs.length)return;toast("Rasmlar yuklanmoqda...");
for(const f of fs){if(!f.type.startsWith("image/"))continue;if(f.size>20e6)throw Error("Rasm juda katta");
const b=await shrink(f,REAL?1100:640,REAL?.8:.6);let url;
if(REAL){const path=U.id+"/"+uid()+".jpg";const{error}=await sb.storage.from("sales").upload(path,b,{contentType:"image/jpeg"});if(error)throw error;url=sb.storage.from("sales").getPublicUrl(path).data.publicUrl}else url=await asURL(b);
await DB.add(tbl,{[tbl==="order_images"?"ord":"sale"]:saleId,url})}}
async function putImg(f){if(!f.type.startsWith("image/"))throw Error("Rasm ochilmadi");if(f.size>20e6)throw Error("Rasm juda katta");const b=await shrink(f,REAL?1100:640,REAL?.8:.6);if(REAL){const path=U.id+"/"+uid()+".jpg";const{error}=await sb.storage.from("sales").upload(path,b,{contentType:"image/jpeg"});if(error)throw error;return sb.storage.from("sales").getPublicUrl(path).data.publicUrl}return asURL(b)}

function homeView(){const op=D.orders.filter(o=>o.status==="open").length,last=[...D.orders].sort((x,y)=>isTop(y)-isTop(x)).slice(0,3);
return `<section class="hero2">${CHORSU_IMG}<div class="hp"><h1>Assalomu alaykum!</h1><p>Dasturchilar bozoriga xush kelibsiz. Buyurtma bering, ishonchli dasturchi toping yoki tayyor loyihangizni soting.</p><div class="stats"><div><b>${op}</b><span>ochiq buyurtma</span></div><div><b>${D.profiles.length}</b><span>dasturchi</span></div><div><b>${D.sales.length}</b><span>loyiha sotuvda</span></div></div><div class="flex"><button class="btn pri" data-a="newOrder">Buyurtma berish</button><button class="btn" data-a="newSale">Loyiha sotish</button></div></div></section><div class="ikat"></div><div class="bar" style="margin-top:14px"><h2>Yangi buyurtmalar</h2><a href="#/orders">Hammasi</a></div>`+(last.map(o=>`<article class="card ${o.status}" data-a="order" data-id="${o.id}">${thumb(o)}<div class="row"><h3>${esc(o.title)}</h3><span class="price">${money(o.budget)}</span></div><p class="meta">${isTop(o)?'<span class="tag top-tag">⭐ TOP</span>':""}<span class="tag">${esc(o.cat)}</span><span class="tag">${ST[o.status]}</span> ${esc(nameOf(o.owner))}</p></article>`).join("")||'<div class="empty">Hozircha buyurtma yo‘q. Birinchisini joylang!</div>')+'<p class="meta" style="text-align:center;margin-top:20px"><a href="#/privacy">Maxfiylik qoidasi</a></p>'}
const RK={order:["Buyurtma","order","orders"],sale:["Loyiha","sale","sales"],user:["Foydalanuvchi","dev","profiles"]};
const V={
home:homeView,
chat:chatView,
admin:()=>{if(!isAdmin)return '<div class="empty">Bu bo‘lim faqat admin uchun.</div>';const rp=D.reports;
return `<div class="bar"><h2>Admin panel</h2></div><p class="hero"><b>${rp.length}</b> shikoyat · ${D.orders.length} buyurtma · ${D.sales.length} loyiha · ${D.profiles.length} foydalanuvchi</p><h3>Shikoyatlar</h3>`+(rp.map(r=>{const m=RK[r.kind],t=D[m[2]].find(x=>x.id===r.target);return `<div class="item"><b>${m[0]}:</b> ${esc(t?(t.title||t.name):"(o‘chirilgan)")}<div class="meta">Sabab: ${esc(r.reason)}${r.txt?" · "+esc(r.txt):""} · ${esc(nameOf(r.reporter))}</div><div class="flex">${t?`<button class="btn" data-a="${m[1]}" data-id="${r.target}">Ko‘rish</button>`:""}${t&&r.kind!=="user"?`<button class="btn bad" data-a="admDel" data-id="${r.id}">O‘chirish</button>`:""}<button class="btn" data-a="admDismiss" data-id="${r.id}">Rad etish</button></div></div>`}).join("")||'<p class="meta">Shikoyat yo‘q</p>')},
privacy:()=>`<div class="bar"><h2>Maxfiylik qoidasi</h2></div><div class="card" style="cursor:default"><h3>Qanday ma’lumot saqlanadi</h3><p>Email, ism, bio, texnologiyalar, siz kiritgan aloqa usullari (Telegram, Instagram, telefon), buyurtma, loyiha, taklif va baholar.</p><h3>Aloqa kimga ko‘rinadi</h3><p>Faqat saytga kirgan foydalanuvchilarga. Kirmaganlar ularni ko‘rmaydi.</p><h3>Ma’lumot qayerda turadi</h3><p>Supabase serverlarida saqlanadi, sayt Netlify orqali ochiladi. Ma’lumotlaringiz sotilmaydi.</p><h3>O‘chirish</h3><p>Buyurtma va e’lonlarni o‘zingiz o‘chira olasiz. Akkauntni to‘liq o‘chirish uchun sayt egasiga murojaat qiling.</p><h3>Shikoyat</h3><p>Noo‘rin yoki firibgar e’lonni "Shikoyat qilish" tugmasi bilan xabar qiling, admin ko‘rib chiqadi.</p></div>`,

${isV(U.id)?'<p class="meta">✓ Siz tasdiqlangan dasturchisiz</p>':`<p><a class="btn" style="display:block;text-align:center;text-decoration:none" href="${esc(tgLink("Salom! DevBozor’da ✓ tasdiqlanishni xohlayman. Ism: "+(P?P.name:"")+" (ID: "+U.id+")"))}" target="_blank" rel="noopener">✓ Tasdiqlanishni so‘rash</a></p><p class="meta">Telegramda yozasiz, narxni kelishib olasiz. To‘lov va hujjatlar tekshirilgach ✓ belgisi qo‘yiladi.</p>`}<form data-form="profile" class="card" style="cursor:default"><label>Ism<input name="name" required maxlength="30" value="${esc(P?.name)}"></label><label>Men haqimda<textarea name="bio" maxlength="300">${esc(P?.bio)}</textarea></label><label>Texnologiyalar (vergul bilan)<input name="skills" maxlength="100" value="${esc(P?.skills)}"></label>${contactFields(P||{})}<p style="margin-top:14px"><button class="btn pri">Saqlash</button></p></form>

<h3 style="margin-top:16px">E’lonlarim (${ms.length})</h3>${ms.map(o=>`<div class="item" data-a="sale" data-id="${o.id}" style="cursor:pointer">${esc(o.title)} <span class="tag">${KIND[o.kind]}</span></div>`).join("")||'<p class="meta">hali yo‘q</p>'}
<h3 style="margin-top:16px">Yuborgan takliflarim (${ap.length})</h3>${ap.map(a=>{const o=D.orders.find(x=>x.id===a.order_id);return o?`<div class="item" data-a="order" data-id="${o.id}" style="cursor:pointer">${esc(o.title)} <span class="tag">${ST[o.status]}</span>${o.dev===U.id?' <span class="tag" style="color:var(--ok)">siz tanlandingiz</span>':""}</div>`:""}).join("")||'<p class="meta">hali yo‘q</p>'}`}

orders(){const q=F.q.toLowerCase();let a=D.orders.filter(o=>(!F.cat||o.cat===F.cat)&&(!F.st||o.status===F.st)&&(o.title+o.descr).toLowerCase().includes(q));if(F.sort)a=[...a].sort((x,y)=>y.budget-x.budget);a=[...a].sort((x,y)=>isTop(y)-isTop(x));

sales(){const q=F.q.toLowerCase();const a=D.sales.filter(o=>(!F.cat||o.cat===F.cat)&&(!F.kind||o.kind===F.kind)&&(o.title+o.descr).toLowerCase().includes(q));
$("#list").innerHTML=a.map(o=>`<article class="card ${o.kind}" data-a="sale" data-id="${o.id}">${thumb(o)}<div class="row"><h3>${esc(o.title)}</h3><span class="price">${money(o.price)}</span></div><p class="meta"><span class="tag">${esc(o.cat)}</span><span class="tag">${KIND[o.kind]}</span> ${esc(nameOf(o.owner))} ${lv(o.owner)}</p><div>${esc(o.descr.slice(0,140))}${o.descr.length>140?"…":""}</div></article>`).join("")||'<div class="empty">e’lon topilmadi</div>'},

$("#list").innerHTML=a.map(({p,s})=>`<article class="card" data-a="dev" data-id="${p.id}"><div class="row"><h3>${lv(p.id)}${esc(p.name)}</h3><span class="st" title="${s.avg.toFixed(1)}">${s.n?stars(s.avg)+" "+s.avg.toFixed(1):"baho yo‘q"}</span></div><p class="meta">${s.n} ta baho</p><div>${(p.skills||"").split(",").filter(x=>x.trim()).map(x=>`<span class="tag">${esc(x.trim())}</span>`).join("")}</div></article>`).join("")||'<div class="empty">dasturchi topilmadi</div>'}
};
function route(){applyTheme();const k=(location.hash.match(/#\/(\w+)/)||[])[1];tab=V[k]?k:"home";

$("#authBtn").textContent=U?(P?.name||"Profil"):"Kirish";$("#langBtn").textContent=LANG.toUpperCase();(document.documentElement||{}).lang=LANG;

/* ---------- Oynalar ---------- */
function authDlg(mode="login"){const s=mode==="signup";modal(`<h3>${s?"Ro‘yxatdan o‘tish":"Kirish"}</h3><form data-form="auth" data-mode="${mode}">${s?'<label>Ism<input name="name" required maxlength="30"></label>':""}<label>Email<input name="email" type="email" required></label><label>Parol<input name="pw" type="password" required minlength="6"></label><p><button class="btn pri">${s?"Ro‘yxatdan o‘tish":"Kirish"}</button></p></form><p class="meta">${s?"Akkaunt bormi?":"Akkaunt yo‘qmi?"} <a href="#" data-a="auth" data-id="${s?"login":"signup"}">${s?"Kirish":"Ro‘yxatdan o‘tish"}</a></p>${s?'<p class="meta">Ro‘yxatdan o‘tib, <a href="#" data-a="privacy">maxfiylik qoidasi</a>ga rozilik bildirasiz.</p>':'<p class="meta"><a href="#" data-a="forgot">Parolni unutdingizmi?</a></p>'}`,s?"Ro‘yxatdan o‘tish":"Kirish")}
function reportDlg(kind,t){if(needLogin())return;modal(`<h3>Shikoyat qilish</h3><form data-form="report" data-kind="${kind}" data-t="${esc(t)}"><div class="lbl"><span>Sabab</span>${sel("reason",["Firibgarlik","Noo‘rin kontent","Spam","Boshqa"],"Firibgarlik",null,"Sabab")}</div><label>Izoh (ixtiyoriy)<textarea name="txt" maxlength="300"></textarea></label><p><button class="btn pri">Yuborish</button></p></form>`,"Shikoyat")}
function rateBlock(id){const mine=U&&D.ratings.find(x=>x.dev===id&&x.rater===U.id);let h=isV(id)?'<p class="meta">✓ Tasdiqlangan dasturchi</p>':"";
if(!U)h+='<div class="sub"><p class="meta">Baho berish uchun <a href="#" data-a="auth">kiring</a></p></div>';
else if(U.id!==id)h+=`<div class="sub"><h3>Baho bering</h3><div class="rate">${[1,2,3,4,5].map(n=>`<button class="rb${mine&&mine.stars>=n?" on":""}" data-a="rate" data-id="${id}:${n}" aria-label="${n}">★</button>`).join("")}</div><p class="meta">Har bir foydalanuvchi bir marta baho beradi, bahoni o‘zgartirish mumkin.</p></div>`;
if(isAdmin)h+=`<p><button class="btn" data-a="verify" data-id="${id}">${isV(id)?"Tasdiqni olib tashlash":"✓ Tasdiqlash"}</button></p>`;return h}
function forgotDlg(){modal(`<h3>Parolni tiklash</h3><p class="meta">Emailingizni yozing, yangi parol havolasi yuboriladi.</p><form data-form="forgot"><label>Email<input name="email" type="email" required></label><p><button class="btn pri">Havola yuborish</button></p></form>`,"Parolni tiklash")}
function newPassDlg(){modal(`<h3>Yangi parol</h3><form data-form="newpass"><label>Yangi parol<input name="pw" type="password" required minlength="6"></label><p><button class="btn pri">Saqlash</button></p></form>`,"Yangi parol")}
function needLogin(){if(U)return false;authDlg();return true}
function orderDlg(){if(needLogin())return;modal(`<h3>Yangi buyurtma</h3><form data-form="order"><label>Sarlavha<input name="title" required maxlength="80"></label><label>Nima kerak? (izoh)<textarea name="descr" required maxlength="600"></textarea></label><div class="flex"><label>Byudjet ($)<input name="budget" type="number" min="1" required></label><div class="lbl"><span>Turi</span>${sel("cat",CATS,CATS[0],null,"Turi")}</div></div><label>Rasmlar (3 tagacha)<input name="imgs" type="file" accept="image/*" multiple></label>${contactFields()}<p><button class="btn pri">Joylash</button></p></form>`,"Yangi buyurtma")}
function saleDlg(){if(needLogin())return;modal(`<h3>Loyiha qo‘yish</h3><form data-form="sale"><label>Nomi<input name="title" required maxlength="80"></label><label>Tavsif<textarea name="descr" required maxlength="600"></textarea></label><label>Narx ($)<input name="price" type="number" min="1" required></label><label>Rasmlar (3 tagacha)<input name="imgs" type="file" accept="image/*" multiple></label><div class="flex"><div class="lbl"><span>Maqsad</span>${sel("kind",Object.entries(KIND),"sale",null,"Maqsad")}</div><div class="lbl"><span>Turi</span>${sel("cat",CATS,CATS[0],null,"Turi")}</div></div>${contactFields()}<p><button class="btn pri">E’lon qilish</button></p></form>`,"Yangi loyiha")}
function showOrder(id){const o=D.orders.find(x=>x.id===id);if(!o)return;
const mine=U&&o.owner===U.id,apps=D.applications.filter(a=>a.order_id===id),rv=D.reviews.find(r=>r.order_id===id),applied=U&&apps.some(a=>a.dev===U.id);
let h=`<h3>${esc(o.title)}</h3><p class="meta"><span class="tag">${esc(o.cat)}</span><span class="tag">${ST[o.status]}</span> <a href="#" data-a="dev" data-id="${o.owner}">${esc(nameOf(o.owner))}</a> · ${dt(o.created)}</p><p>${esc(o.descr)}</p>${gal(o,mine||isAdmin)}<p class="price">${money(o.budget)}</p>${contactHTML(o)}<p>${favBtn("order",o.id)} ${msgBtn(o.owner)}</p>`;
if(o.dev)h+=`<p class="meta">Dasturchi: <a href="#" data-a="dev" data-id="${o.dev}">${esc(nameOf(o.dev))}</a> ${lv(o.dev)}</p>`;
if(mine){h+=`<div class="sub"><h3>Takliflar (${apps.length})</h3>`+apps.map(a=>`<div class="item"><div class="row"><span><a href="#" data-a="dev" data-id="${a.dev}">${esc(nameOf(a.dev))}</a> ${lv(a.dev)}</span>${o.status==="open"?`<button class="btn" data-a="pick" data-id="${a.id}">Tanlash</button>`:""}</div><div class="meta">${esc(a.msg)}</div></div>`).join("")+(apps.length?"":'<p class="meta">hali taklif yo‘q</p>')+`</div>`;
if(o.status==="progress")h+=`<p><button class="btn pri" data-a="done" data-id="${o.id}">Ish bajarildi</button></p>`;
if(o.status==="done"&&o.dev&&!rv)h+=`<div class="sub"><h3>Dasturchiga baho bering</h3><form data-form="review" data-id="${o.id}"><div class="lbl"><span>Yulduz</span>${sel("stars",[[5,"★★★★★ a’lo"],[4,"★★★★ yaxshi"],[3,"★★★ o‘rtacha"],[2,"★★ yomon"],[1,"★ juda yomon"]],5,null,"Baho")}</div><label>Sharh<textarea name="txt" maxlength="300"></textarea></label><p><button class="btn pri">Baho yuborish</button></p></form></div>`;
if(!isTop(o))h+=`<p><a class="btn pri" style="display:block;text-align:center;text-decoration:none" href="${esc(tgLink("Salom! DevBozor’da buyurtmamni TOP qilmoqchiman. Buyurtma: "+o.title+" (ID: "+o.id+")"))}" target="_blank" rel="noopener">⭐ TOP qilish</a></p><p class="meta">Telegramda yozasiz, narxni kelishib olasiz. To‘lovdan keyin buyurtma 7 kun ro‘yxat boshida turadi.</p>`;
h+=`<p><button class="btn bad" data-a="delOrder" data-id="${o.id}">Buyurtmani o‘chirish</button></p>`}
else if(o.status==="open"){h+=`<div class="sub">`+(!U?`<p class="meta">Taklif yuborish uchun <a href="#" data-a="auth">kiring</a></p>`:applied?`<p class="meta">taklifingiz yuborilgan, mijoz javobini kuting</p>`:`<h3>Taklif yuborish</h3><form data-form="apply" data-id="${id}"><label>Xabar (narx, muddat, tajriba)<textarea name="msg" required maxlength="300"></textarea></label><p><button class="btn pri">Yuborish</button></p></form>`)+`</div>`}
if(rv)h+=`<div class="sub"><h3>Baho</h3><div class="item"><span class="st">${stars(rv.stars)}</span> ${esc(nameOf(rv.reviewer))}<div class="meta">${esc(rv.txt||"")}</div></div></div>`;
if(U&&!mine)h+=`<p><button class="btn" data-a="report" data-id="order:${o.id}">Shikoyat qilish</button></p>`;
if(isAdmin&&!mine)h+=`<p><button class="btn bad" data-a="delOrder" data-id="${o.id}">Admin: o‘chirish</button></p>`;
if(isAdmin)h+=`<div class="flex"><button class="btn" data-a="top" data-id="${o.id}">Admin: TOP 7 kun</button>${isTop(o)?`<button class="btn" data-a="untop" data-id="${o.id}">Admin: TOP ni olib tashlash</button>`:""}</div>`;
modal(h,"Buyurtma")}
function showSale(id){const o=D.sales.find(x=>x.id===id);if(!o)return;const mine=U&&o.owner===U.id;
modal(`<h3>${esc(o.title)}</h3><p class="meta"><span class="tag">${esc(o.cat)}</span><span class="tag">${KIND[o.kind]}</span> <a href="#" data-a="dev" data-id="${o.owner}">${esc(nameOf(o.owner))}</a> ${lv(o.owner)} · ${dt(o.created)}</p><p>${esc(o.descr)}</p>${gal(o,mine||isAdmin)}<p class="price">${money(o.price)}</p>${contactHTML(o)}<p>${favBtn("sale",o.id)} ${msgBtn(o.owner)}</p>${U&&!mine?`<p><button class="btn" data-a="report" data-id="sale:${o.id}">Shikoyat qilish</button></p>`:""}${(mine||isAdmin)?`<p><button class="btn bad" data-a="delSale" data-id="${o.id}">E’lonni o‘chirish</button></p>`:""}`,"Loyiha")}
function showDev(id){const p=D.profiles.find(x=>x.id===id);if(!p)return;const s=stat(id),rs=D.reviews.filter(r=>r.dev===id).slice(0,6);
modal(`<h3>${lv(id)}${esc(p.name)}</h3><p class="meta"><span class="st">${s.n?stars(s.avg):""}</span> ${s.n?s.avg.toFixed(1):"baho yo‘q"} · ${s.n} ta baho</p><p>${esc(p.bio||"tavsif yo‘q")}</p><p>${(p.skills||"").split(",").filter(x=>x.trim()).map(x=>`<span class="tag">${esc(x.trim())}</span>`).join("")}</p>${contactHTML(p)}<p>${favBtn("dev",id)} ${msgBtn(id)}</p>${pfBlock(id)}<div class="sub"><h3>Sharhlar</h3>${rs.map(r=>`<div class="item"><span class="st">${stars(r.stars)}</span> ${esc(nameOf(r.reviewer))}<div class="meta">${esc(r.txt||"")}</div></div>`).join("")||'<p class="meta">hali sharh yo‘q</p>'}</div>${rateBlock(id)}${U&&U.id!==id?`<p><button class="btn" data-a="report" data-id="user:${id}">Shikoyat qilish</button></p>`:""}`,"Dasturchi")}

close:()=>dlg.close(),

img:(_,el)=>{mnu.innerHTML=tb("Rasm")+`</div><div class="opts"><img src="${esc(el.dataset.u)}" style="width:100%;border-radius:10px" alt=""></div>`;mnu.showModal();trNode(mnu)},
delImg:id=>run(async()=>{const x=D.sale_images.find(i=>i.id===id)||D.order_images.find(i=>i.id===id);await DB.del(D.sale_images.includes(x)?"sale_images":"order_images",id);if(REAL&&x){try{const m=x.url.split("/sales/")[1];if(m)await sb.storage.from("sales").remove([decodeURIComponent(m)])}catch(e){}}await load();route();if(x){if(x.sale)showSale(x.sale);else showOrder(x.ord)}}),

chat:id=>chatDlg(id),
fav:id=>run(async()=>{const[k,t]=id.split(":");const f=favOf(k,t);if(f)await DB.del("favs",f.id);else await DB.add("favs",{user_id:U.id,kind:k,target:t});await load();route();({order:showOrder,sale:showSale,dev:showDev})[k](t)}),
delPf:id=>run(async()=>{await DB.del("portfolio",id);await load();route()}),
top:id=>run(async()=>{try{await DB.del("tops",id)}catch(e){}await DB.add("tops",{id,until_at:new Date(Date.now()+7*864e5).toISOString()});await load();route();showOrder(id);toast("TOP qilindi")}),
untop:id=>run(async()=>{await DB.del("tops",id);await load();route();showOrder(id)}),
verify:id=>run(async()=>{if(isV(id))await DB.del("verified",id);else await DB.add("verified",{id});await load();route();showDev(id)}),
lang:()=>{LANG=LANG==="uz"?"ru":LANG==="ru"?"en":"uz";try{localStorage.setItem("lang",LANG)}catch(e){}dlg.close();route()},

const trT=t=>{if(LANG==="uz")return t;const k=t.trim();if(!k)return t;const M=LANG==="en"?EN:EX;if(M.has(k))return t.replace(k,M.get(k));const m=k.match(/^(.+) \((\d+)\)$/);if(m&&M.has(m[1]))return t.replace(k,M.get(m[1])+" ("+m[2]+")");if(LANG==="ru")return t.replace(/Sabab:/g,"Причина:").replace(/ shikoyat · (\d+) buyurtma · (\d+) loyiha · (\d+) foydalanuvchi/,"жалоб · $1 заказов · $2 проектов · $3 пользователей").replace(/(\d+) ta baho/g,"$1 оценок").replace(/baho yo‘q/g,"нет оценок").replace(/(\d+) taklif$/,"$1 предл.").replace(/Telefon:/g,"Телефон:");return t};
const setT=n=>{const v=trT(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v};
function trNode(r){const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT);let x;while(x=w.nextNode())setT(x);if(r.querySelectorAll)r.querySelectorAll("[placeholder]").forEach(e=>{const p=e.getAttribute("placeholder"),v=trT(p);if(v!==p)e.setAttribute("placeholder",v)})}
if(typeof MutationObserver!=="undefined"){new MutationObserver(ms=>{if(LANG==="uz")return;ms.forEach(m=>{m.addedNodes.forEach(n=>{if(n.nodeType===3)setT(n);else if(n.nodeType===1)trNode(n)});if(m.type==="characterData")setT(m.target)})}).observe(document.body,{childList:true,subtree:true,characterData:true})}
